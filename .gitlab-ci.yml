include:
  - project: "waldur/waldur-pipelines"
    file: "/templates/utils/release-utils.yml"
  - project: "waldur/waldur-pipelines"
    file: "/templates/utils/verify-generated-artifact.yml"

variables:
  npm_config_cache: "$CI_PROJECT_DIR/.npm"

cache:
  key:
    files:
      - package-lock.json
  paths:
    - .npm/

stages:
  - codegen
  - release
  - publish

Fetch OpenAPI schema:
  extends: .fetch-openapi-schema
  stage: codegen
  variables:
    DOWNLOAD_TYPESCRIPT_SCHEMA: "true"

Build TypeScript SDK:
  stage: codegen
  image: registry.hpc.ut.ee/mirror/library/node:lts-alpine
  rules:
    - if: '$CI_PIPELINE_SOURCE == "pipeline"'
    - if: '$CI_PIPELINE_SOURCE == "trigger"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
  needs:
    - job: Fetch OpenAPI schema
      artifacts: true
  before_script:
    - apk add --no-cache bash yq
  script:
    - bash scripts/generate-ts-sdk.sh
  artifacts:
    paths:
      - src/
      - package.json
      - package-lock.json
    expire_in: 1 day

# The 8.1.0 client was generated from the 8.0.9 schema — the fetch had silently
# fallen back — so it contained none of that release's 234 new operations and
# every job still went green. This compares what was generated against what was
# asked for, before it can be released.
Verify generated client:
  extends: .verify-generated-artifact
  stage: codegen
  rules:
    - if: '$CI_PIPELINE_SOURCE == "pipeline"'
    - if: '$CI_PIPELINE_SOURCE == "trigger"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
  needs:
    - job: Fetch OpenAPI schema
      artifacts: true
    - job: Build TypeScript SDK
      artifacts: true
  variables:
    GENERATED_DIR: "src"

Release TypeScript/JavaScript SDK:
  stage: release
  image: registry.hpc.ut.ee/mirror/library/node:lts-alpine
  rules:
    - if: '$CI_PIPELINE_SOURCE == "pipeline"'
    - if: '$CI_PIPELINE_SOURCE == "trigger"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
  needs:
    - job: Build TypeScript SDK
      artifacts: true
    # Gate the release on the check, so a stale client cannot be published.
    - job: Verify generated client
      artifacts: false
  before_script:
    - apk add --no-cache bash git
    - git config --global user.name "$GITLAB_USER_NAME"
    - git config --global user.email "$GITLAB_USER_EMAIL"
    # Authenticate origin with token for pushing back commits & tags
    - git remote set-url origin "https://gitlab-ci-token:${GITLAB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
  script:
    # src/ is passed from the Test TypeScript SDK job automatically
    - |
      git add src package.json package-lock.json
      if [ -n "$RELEASE_VERSION" ]; then
        git diff --cached --quiet && echo "js-client version already set" || git commit -m "Release: bump version and update code to $RELEASE_VERSION"
        git tag -a $RELEASE_VERSION -m "Release version $RELEASE_VERSION" || echo "Tag $RELEASE_VERSION already exists"
        git push origin $RELEASE_VERSION || echo "Tag $RELEASE_VERSION already pushed"
      else
        DEV_VERSION=$(node -p "require('./package.json').version")
        git diff --cached --quiet && echo "No changes" || git commit -m "chore: nightly update of Waldur TypeScript SDK to $DEV_VERSION"
      fi
    - git pull --rebase origin main && git push origin HEAD:main || echo "main already up to date in js-client"

Publish Dev to NPM:
  stage: publish
  image: registry.hpc.ut.ee/mirror/library/node:lts-alpine
  rules:
    - if: '$CI_PIPELINE_SOURCE == "pipeline" && $RELEASE_VERSION == ""'
    - if: '$CI_PIPELINE_SOURCE == "trigger" && $RELEASE_VERSION == ""'
    - if: '$CI_PIPELINE_SOURCE == "web" && $RELEASE_VERSION == ""'
  needs:
    - job: Build TypeScript SDK
      artifacts: false
    - job: Release TypeScript/JavaScript SDK
  before_script:
    - apk add --no-cache bash git
  script:
    - set -e
    - |
      git fetch origin main
      git checkout -B main origin/main
      npm install
      npm run build
      echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > ~/.npmrc
      npm publish --tag dev

Publish Release to NPM:
  stage: publish
  image: registry.hpc.ut.ee/mirror/library/node:lts-alpine
  rules:
    - if: '$CI_PIPELINE_SOURCE == "pipeline" && $RELEASE_VERSION =~ /^\d+\.\d+\.\d+$/'
    - if: '$CI_PIPELINE_SOURCE == "trigger" && $RELEASE_VERSION =~ /^\d+\.\d+\.\d+$/'
    - if: '$CI_PIPELINE_SOURCE == "web" && $RELEASE_VERSION =~ /^\d+\.\d+\.\d+$/'
  needs:
    - job: Build TypeScript SDK
      artifacts: true
    # Gate the registry publish too, not just the tag. These jobs use `needs`,
    # so a satisfied dependency lets them run even while another job in an
    # earlier stage is failing — which is exactly how the SDK jobs published
    # during 8.1.0 while the schema job was red.
    - job: Verify generated client
      artifacts: false
  before_script:
    - apk add --no-cache bash git
  script:
    - set -e
    # `Release TypeScript/JavaScript SDK` already commits the bump to main, so
    # by the time this job checks out the ref, package.json is usually at
    # $RELEASE_VERSION — and `npm version` exits 1 with "Version not changed"
    # on a no-op bump, failing the publish. That is what blocked the 8.1.0
    # release from reaching npm. Bump only when it is actually needed.
    - |
      current=$(node -p "require('./package.json').version")
      if [ "$current" = "$RELEASE_VERSION" ]; then
        echo "package.json is already at $RELEASE_VERSION — skipping bump"
      else
        echo "Bumping package.json from $current to $RELEASE_VERSION"
        npm version "$RELEASE_VERSION" --no-git-tag-version
      fi
    - npm install
    - npm run build
    - echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > ~/.npmrc
    - npm publish
